server:
  port: 8080

spring:
  application:
    name: aether-mock
  threads:
    virtual:
      enabled: true
  ai:
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      api-key: ${GEMINI_API_KEY}
      chat:
        base-url: https://generativelanguage.googleapis.com/v1beta/openai/
        options:
          model: gemini-3.6-flash
          temperature: 0.1

aethermock:
  wiremock:
    port: 8089
  data-dir: src/main/resources/mock-data
